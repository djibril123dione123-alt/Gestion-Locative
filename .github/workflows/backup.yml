name: Encrypted database backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL and encryption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssl

      - name: Create encrypted backup
        id: backup
        run: bash scripts/backup-supabase.sh

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.backup_file }}
            ${{ steps.backup.outputs.checksum_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Copy encrypted backup to off-site storage
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.BACKUP_BUCKET != '' }}
        run: |
          aws s3 cp "${{ steps.backup.outputs.backup_file }}" "s3://${BACKUP_BUCKET}/samay-keur/"
          aws s3 cp "${{ steps.backup.outputs.checksum_file }}" "s3://${BACKUP_BUCKET}/samay-keur/"

      - name: Open an incident on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Database backup failed (${context.runId})`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure'
            });
            if (!existing.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['backup-failure'],
                body: `The encrypted database backup workflow failed. Inspect run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
            }
